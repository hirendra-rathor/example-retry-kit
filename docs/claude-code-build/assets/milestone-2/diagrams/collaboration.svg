<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1265" width="1500" height="1265" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Retry Kit collaboration: waits before reads two to four</title><desc id="desc">Sequence of one retry() call for the report viewer with four attempts, initial_delay 0.1 and max_delay 0.25. The attempt loop calls load_report at once; after each ReportNotReady with attempts left it takes the next wait from the wait schedule (0.1, then 0.2, then 0.4 capped to 0.25) and passes it to the sleep function before the next read. Read 4 returns the report. If read 4 also fails, the loop re-raises it without asking for another wait. With no delay set the schedule is never consulted and sleep is never called. Gray means context, blue means changed, green means new.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#435970"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#22a06b"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker></defs>
<rect width="1500" height="1265" fill="white"/>
<text x="28" y="43" font-size="29" font-weight="700" fill="#182f46" text-anchor="start">Retry Kit collaboration: waits before reads 2, 3 and 4</text>
<text x="28" y="75" font-size="17" font-weight="400" fill="#182f46" text-anchor="start">One thread  •  The attempt loop asks the wait schedule for the next wait and passes it to the injected sleep function before each retry.</text>
