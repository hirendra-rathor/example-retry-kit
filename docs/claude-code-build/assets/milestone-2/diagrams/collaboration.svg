<path d="M1300 237 V1220" stroke="#9aa8b6" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="30" y="250" width="470" height="50" rx="6" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.4"/>
<text x="40" y="271" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">policy = RetryPolicy(retry_on=[ReportNotReady],</text>
<text x="40" y="290" font-size="14" font-weight="400" fill="#192e42" text-anchor="start">    max_attempts=4, initial_delay=0.1, max_delay=0.25)</text>
