<rect x="160.0" y="134" width="75" height="23" rx="4" fill="#3b82f6"/>
<text x="197.5" y="150" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">changed</text>
<text x="37.0" y="167" font-size="12" font-weight="700" fill="#48617a" text-anchor="start">PARTICIPANT</text>
