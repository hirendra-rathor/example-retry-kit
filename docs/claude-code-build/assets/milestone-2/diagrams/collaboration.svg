<text x="1310.0" y="36" font-size="13" font-weight="700" fill="#0a1d28" text-anchor="middle">context</text>
<rect x="20" y="105" width="490" height="1130" rx="10" fill="#fbfcfd" stroke="#8a99a8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="36" y="128" font-size="14" font-weight="700" fill="#48617a" text-anchor="start">Report viewer application (consumer code)</text>
