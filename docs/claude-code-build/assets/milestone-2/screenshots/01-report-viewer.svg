<svg xmlns="http://www.w3.org/2000/svg" width="787" height="426" viewBox="0 0 787 426" role="img" aria-labelledby="title desc">
<title id="title">Milestone 2 report viewer</title>
<desc id="desc">Terminal capture rendered from the recorded output of: uv run --locked python examples/read_report.py; uv run --locked python examples/read_report.py --not-ready-reads 3 --show-waits; uv run --locked python examples/read_report.py --not-ready-reads 4 --show-waits. Standard output is light gray, standard error is amber.</desc>
<rect width="787" height="426" rx="10" fill="#1d232c"/>
<rect width="787" height="36" rx="10" fill="#2b323d"/>
<rect y="26" width="787" height="10" fill="#2b323d"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="393.5" y="23" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b9c2ce" text-anchor="middle">Milestone 2 report viewer</text>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<text x="22" y="68"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py</tspan></text>
<text x="22" y="88" fill="#d7dde5">Report ready: 3 rows.</text>
<text x="22" y="108" fill="#8792a2">[exit status 0]</text>
<text x="22" y="148"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py --not-ready-reads 3 --show-waits</tspan></text>
<text x="22" y="168" fill="#f4bf75">Waiting 0.1 s before read 2</text>
<text x="22" y="188" fill="#f4bf75">Waiting 0.2 s before read 3</text>
<text x="22" y="208" fill="#f4bf75">Waiting 0.25 s before read 4</text>
<text x="22" y="228" fill="#d7dde5">Report ready: 3 rows.</text>
<text x="22" y="248" fill="#8792a2">[exit status 0]</text>
<text x="22" y="288"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py --not-ready-reads 4 --show-waits</tspan></text>
<text x="22" y="308" fill="#f4bf75">Waiting 0.1 s before read 2</text>
<text x="22" y="328" fill="#f4bf75">Waiting 0.2 s before read 3</text>
<text x="22" y="348" fill="#f4bf75">Waiting 0.25 s before read 4</text>
<text x="22" y="368" fill="#f4bf75">Viewer received ReportNotReady after 4 read(s): report is still being prepared (read 4)</text>
<text x="22" y="388" fill="#8792a2">[exit status 1]</text>
</g></svg>
