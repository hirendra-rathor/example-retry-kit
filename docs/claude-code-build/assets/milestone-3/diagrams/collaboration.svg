<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1375" width="1560" height="1375" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Retry Kit collaboration: a one-second budget for starting retries</title><desc id="desc">Sequence of one retry() call for the report viewer with time_budget 1.0, waits of 0.3 seconds and reads that take 0.4 seconds, on a controlled clock. The attempt loop reads the clock at the first call and fixes the deadline at 1.0. Read 1 runs from 0.0 to 0.4 and raises ReportNotReady. The deadline answers that 0.4 plus 0.3 is before 1.0, so the loop sleeps 0.3; at 0.7 the deadline confirms there is still time and read 2 starts, ending at 1.1. If it returns the report the viewer gets it. If it raises, 1.1 plus 0.3 is past the deadline, so the loop re-raises read 2&#x27;s exception without waiting even though attempts remain. If the wait had overrun to 1.0 or later, read 2 would not start and read 1&#x27;s exception would be raised. Gray means context, blue means changed, green means new.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#435970"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#22a06b"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/></marker></defs>
