<svg xmlns="http://www.w3.org/2000/svg" width="1158" height="666" viewBox="0 0 1158 666" role="img" aria-labelledby="title desc">
<title id="title">Milestone 3 report viewer</title>
<desc id="desc">Terminal capture rendered from the recorded output of: uv run --locked python examples/read_report.py --read-seconds 0.4 --delay 0.3 --time-budget 1 --not-ready-reads 1 --show-timeline; uv run --locked python examples/read_report.py --read-seconds 0.4 --delay 0.3 --time-budget 1 --not-ready-reads 2 --show-timeline; uv run --locked python examples/read_report.py --read-seconds 0.4 --delay 0.3 --not-ready-reads 2 --show-timeline. Standard output is light gray, standard error is amber.</desc>
<rect width="1158" height="666" rx="10" fill="#1d232c"/>
<rect width="1158" height="36" rx="10" fill="#2b323d"/>
<rect y="26" width="1158" height="10" fill="#2b323d"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="579.0" y="23" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b9c2ce" text-anchor="middle">Milestone 3 report viewer</text>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<text x="22" y="68"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py --read-seconds 0.4 --delay 0.3 --time-budget 1 --not-ready-reads 1 --show-timeline</tspan></text>
<text x="22" y="88" fill="#f4bf75"> 0.00 s  read 1 starts</text>
<text x="22" y="108" fill="#f4bf75"> 0.40 s  read 1 raises ReportNotReady</text>
<text x="22" y="128" fill="#f4bf75"> 0.40 s  waits 0.3 s</text>
<text x="22" y="148" fill="#f4bf75"> 0.71 s  read 2 starts</text>
<text x="22" y="168" fill="#f4bf75"> 1.11 s  read 2 returns the report</text>
<text x="22" y="188" fill="#d7dde5">Report ready: 3 rows.</text>
<text x="22" y="208" fill="#8792a2">[exit status 0]</text>
<text x="22" y="248"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py --read-seconds 0.4 --delay 0.3 --time-budget 1 --not-ready-reads 2 --show-timeline</tspan></text>
<text x="22" y="268" fill="#f4bf75"> 0.00 s  read 1 starts</text>
<text x="22" y="288" fill="#f4bf75"> 0.41 s  read 1 raises ReportNotReady</text>
<text x="22" y="308" fill="#f4bf75"> 0.41 s  waits 0.3 s</text>
<text x="22" y="328" fill="#f4bf75"> 0.71 s  read 2 starts</text>
<text x="22" y="348" fill="#f4bf75"> 1.12 s  read 2 raises ReportNotReady</text>
<text x="22" y="368" fill="#f4bf75">Viewer received ReportNotReady after 2 read(s): report is still being prepared (read 2)</text>
<text x="22" y="388" fill="#8792a2">[exit status 1]</text>
<text x="22" y="428"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py --read-seconds 0.4 --delay 0.3 --not-ready-reads 2 --show-timeline</tspan></text>
<text x="22" y="448" fill="#f4bf75"> 0.00 s  read 1 starts</text>
<text x="22" y="468" fill="#f4bf75"> 0.41 s  read 1 raises ReportNotReady</text>
<text x="22" y="488" fill="#f4bf75"> 0.41 s  waits 0.3 s</text>
<text x="22" y="508" fill="#f4bf75"> 0.71 s  read 2 starts</text>
<text x="22" y="528" fill="#f4bf75"> 1.11 s  read 2 raises ReportNotReady</text>
<text x="22" y="548" fill="#f4bf75"> 1.11 s  waits 0.3 s</text>
<text x="22" y="568" fill="#f4bf75"> 1.42 s  read 3 starts</text>
<text x="22" y="588" fill="#f4bf75"> 1.82 s  read 3 returns the report</text>
<text x="22" y="608" fill="#d7dde5">Report ready: 3 rows.</text>
<text x="22" y="628" fill="#8792a2">[exit status 0]</text>
</g></svg>
