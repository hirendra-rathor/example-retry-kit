<svg xmlns="http://www.w3.org/2000/svg" width="787" height="306" viewBox="0 0 787 306" role="img" aria-labelledby="title desc">
<title id="title">Milestone 1 report viewer</title>
<desc id="desc">Terminal capture rendered from the recorded output of: uv run --locked python examples/read_report.py; uv run --locked python examples/read_report.py --attempts 2; uv run --locked python examples/read_report.py --deny-access. Standard output is light gray, standard error is amber.</desc>
<rect width="787" height="306" rx="10" fill="#1d232c"/>
<rect width="787" height="36" rx="10" fill="#2b323d"/>
<rect y="26" width="787" height="10" fill="#2b323d"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="393.5" y="23" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b9c2ce" text-anchor="middle">Milestone 1 report viewer</text>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<text x="22" y="68"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py</tspan></text>
<text x="22" y="88" fill="#d7dde5">Report ready: 3 rows.</text>
<text x="22" y="108" fill="#8792a2">[exit status 0]</text>
<text x="22" y="148"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py --attempts 2</tspan></text>
<text x="22" y="168" fill="#f4bf75">Viewer received ReportNotReady after 2 read(s): report is still being prepared (read 2)</text>
<text x="22" y="188" fill="#8792a2">[exit status 1]</text>
<text x="22" y="228"><tspan fill="#5fd38d">$ </tspan><tspan fill="#ffffff" font-weight="700">uv run --locked python examples/read_report.py --deny-access</tspan></text>
<text x="22" y="248" fill="#f4bf75">Viewer received PermissionError after 1 read(s): report access denied (read 1)</text>
<text x="22" y="268" fill="#8792a2">[exit status 1]</text>
</g></svg>
