<svg xmlns="http://www.w3.org/2000/svg" width="860" height="284" viewBox="0 0 860 284" role="img" aria-labelledby="title desc">
  <title id="title">Calling Retry Kit from a Python application</title>
  <desc id="desc">A report viewer passes its load_report function and a policy to retry(). Retry Kit invokes the function in the same Python process and retries selected failures. The caller receives the function’s result or exception.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#245b50" stroke-width="2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="858" height="282" rx="12" fill="#f7faf7" stroke="#b9cfc7" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173e38">
    <text x="27" y="44" font-family="Georgia, serif" font-size="29">A library call in one Python process</text>
    <rect x="26" y="69" width="229" height="185" rx="8" fill="#fffefa" stroke="#a5c2b5"/>
    <rect x="605" y="69" width="229" height="185" rx="8" fill="#e5efe9" stroke="#a5c2b5"/>

    <g transform="translate(47 90)" fill="none" stroke="#316e60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 0 H20 L28 8 V29 H1 Z M19 1 V9 H27 M7 16 H21 M7 22 H18"/>
    </g>
    <text x="46" y="155" font-size="25" font-weight="bold">Report viewer</text>
    <text x="46" y="193" font-size="18">Supplies a function</text>
    <text x="46" y="220" font-size="18">and a retry policy.</text>

    <g transform="translate(626 90)" fill="none" stroke="#316e60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12 A12 12 0 0 1 24 7 L26 11 M26 3 V11 H18 M26 18 A12 12 0 0 1 4 23 L2 19 M2 27 V19 H10"/>
    </g>
    <text x="625" y="155" font-size="25" font-weight="bold">Retry Kit</text>
    <text x="625" y="193" font-size="18">Calls the function again</text>
    <text x="625" y="220" font-size="18">when its policy allows.</text>

    <g text-anchor="middle">
      <text x="430" y="107" font-family="Menlo, Consolas, monospace" font-size="18">retry(load_report, policy=…)</text>
      <path d="M255 126 H603" fill="none" stroke="#245b50" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="430" y="188" font-size="19">Result or exception</text>
      <path d="M605 207 H257" fill="none" stroke="#245b50" stroke-width="2" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>
